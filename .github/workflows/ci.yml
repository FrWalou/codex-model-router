name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -s .agents/skills/codex-model-router/tests -v
      - name: Compile advisor
        run: python -m py_compile .agents/skills/codex-model-router/scripts/advisor.py

  validate-agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parse custom-agent TOML
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib

          files = sorted(Path(".codex/agents").glob("pas_*.toml"))
          assert len(files) == 7, files
          for path in files:
              tomllib.loads(path.read_text(encoding="utf-8"))
          print(f"validated {len(files)} agent definitions")
          PY
